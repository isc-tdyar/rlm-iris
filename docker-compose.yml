services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Defaults to the Docker Hub community image. Point it at a WRC-obtained
        # AI Hub build to compile the RLMAIHub package and run its probe:
        #   IRIS_IMAGE=containers.intersystems.com/intersystems/iris:2026.3AI... \
        #     docker compose build
        # The community image has no %AI.*, so RLMAIHub.Provider is skipped at
        # compile time and the rlm-core suite runs green regardless.
        IMAGE: ${IRIS_IMAGE:-intersystems/iris-community:latest-em}
    container_name: rlm-iris
    image: rlm-iris
    init: true
    # Ephemeral host ports: this machine runs several IRIS instances and 1972 is
    # already owned by another project. Use `docker compose port iris 1972` to
    # find the mapping.
    ports:
      - "1972"
      - "52773"
    # No durable %SYS: the classes are compiled into the image at build time, so
    # a fresh container is the reproducible state we actually want.
    volumes:
      - ./:/home/irisowner/dev
